name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budgettest
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: aipolicy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U budgettest -d aipolicy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=aipolicy_test;Username=budgettest;Password=test-only-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AIPolicyEngine.slnx

      - name: Build
        run: dotnet build src/AIPolicyEngine.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/AIPolicyEngine.Tests/AIPolicyEngine.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        run: |
          dotnet list src/AIPolicyEngine.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages detected!"
            exit 1
          fi

  validate-lab:
    name: Validate Azure budget lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.3
      - name: Format
        run: terraform -chdir=iac fmt -check -recursive
      - name: Initialize providers without a backend
        run: terraform -chdir=iac init -backend=false -input=false
      - name: Validate infrastructure
        run: terraform -chdir=iac validate
      - name: Test Managed Redis creation and reuse
        run: |
          terraform -chdir=iac/modules/cache init -backend=false -input=false
          terraform -chdir=iac/modules/cache test
      - name: Test PostgreSQL creation and reuse
        run: |
          terraform -chdir=iac/modules/postgresql init -backend=false -input=false
          terraform -chdir=iac/modules/postgresql test
      - name: Validate lab scripts
        run: |
          bash -n scripts/lab/deploy-lab.sh
          node --check scripts/lab/configure-lab.mjs
          node --check scripts/lab/common.mjs
          node --check scripts/lab/build-lab.mjs
          node --check scripts/lab/e2e-budget.mjs

  frontend:
    name: Validate dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/aipolicyengine-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/aipolicyengine-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
